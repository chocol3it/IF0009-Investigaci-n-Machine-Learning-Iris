spring.application.name=iris
server.port=8080

# Base de datos H2 guardada en el archivo ./data/irisdb.mv.db (dentro de iris-backend).
# No hay usuarios ni contraseñas reales: es una base local solo para la demo.
spring.datasource.url=jdbc:h2:file:./data/irisdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# 'update' crea las tablas Muestra, Prediccion y Entrenamiento la primera vez.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Consola web de H2 para revisar las tablas: http://localhost:8080/h2-console
# (JDBC URL: jdbc:h2:file:./data/irisdb, usuario: sa, sin contraseña)
spring.h2.console.enabled=true

# Valor de k con el que se entrena el modelo al arrancar el backend.
app.modelo.k-inicial=5
